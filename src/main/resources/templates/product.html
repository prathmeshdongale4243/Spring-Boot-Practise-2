<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    font-family:Arial,sans-serif;
}

.form-wrapper{
    min-height: calc(100vh - 56px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.form-box{
    width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.form-title{
    text-align:center;
    margin-bottom:25px;
    color:#0d6efd;
    font-weight:bold;
}

.btn{
    width:100%;
}

/* Success Message */
.success-box{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    z-index:9999;
}

.alert{
    font-size:22px;
    font-weight:bold;
    padding:18px 25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}
</style>

</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<nav th:fragment="navbar(activePage)"
     class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">Product App</a>

    

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">


				  <li class="nav-item">

                    <a class="nav-link" th:href="@{home}">
                        Home
                    </a>

                </li>
                
                <li class="nav-item">

                    <a class="nav-link"
                       th:classappend="${activePage=='add'} ? ' active' : ''"
                       th:href="@{product-form}">
                        Add Product
                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:classappend="${activePage=='list'} ? ' active' : ''"
                       th:href="@{display}">
                        Display Product
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Success Message -->
<div class="success-box" th:if="${success}">
    <div id="successAlert"
         class="alert alert-success alert-dismissible fade show text-center"
         role="alert">
        ✅ <span th:text="${success}"></span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>
</div>

<div class="form-wrapper">
    <div class="form-box">
        <h2 class="form-title">Add Product</h2>

        <form method="post"
              th:action="@{/save}"
              th:object="${product}">

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       placeholder="Enter product name"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid':''">
                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number"
                       class="form-control"
                       th:field="*{price}"
                       placeholder="Enter price">
                <p style="color:red" th:errors="*{price}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number"
                       class="form-control"
                       th:field="*{quantity}"
                       placeholder="Enter quantity">
                <p style="color:red" th:errors="*{quantity}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{category}">
                    <option value="">Select any category</option>
                    <option value="Milk">Milk</option>
                    <option value="Curd">Curd</option>
                    <option value="Butter">Butter</option>
                    <option value="Peda">Peda</option>
                    <option value="Barfi">Barfi</option>
                    <option value="Lassi">Lassi</option>
                    <option value="ShriKhand">ShriKhand</option>
                </select>
                <p style="color:red" th:errors="*{category}"></p>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control"
                          rows="3"
                          th:field="*{description}"
                          placeholder="Enter product description"></textarea>
                <p style="color:red" th:errors="*{description}"></p>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Product
            </button>
        </form>
    </div>
</div>

<script th:if="${success}">
setTimeout(function(){
    let alert=document.getElementById("successAlert");
    if(alert){
        let bsAlert=bootstrap.Alert.getOrCreateInstance(alert);
        bsAlert.close();
    }
},5000);
</script>

</body>
</html>
