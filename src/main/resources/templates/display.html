<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Product List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1200px;
}

.container-box{
    margin-top:40px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
    color:#0d6efd;
    font-weight:bold;
}

.table th{
    background:#0d6efd;
    color:white;
    text-align:center;
    vertical-align:middle;
}

.table td{
    text-align:center;
    vertical-align:middle;
}

.success-box{
    width:80%;
    margin:20px auto;
}

.pagination{
    margin-top:25px;
}

.page-link{
    font-weight:bold;
}

@media(max-width:768px){

    .container-box{
        padding:15px;
        margin-top:20px;
    }

    h2{
        font-size:24px;
        text-align:center;
    }

    .success-box{
        width:100%;
    }

    .table{
        font-size:14px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container py-4">

    <!-- Success Message -->

    <div class="success-box" th:if="${success}">
        <div id="successAlert"
             class="alert alert-success alert-dismissible fade show">

            <strong>Success!</strong>
            <span th:text="${success}"></span>

            <button class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>
    </div>

    <!-- Delete Message -->

    <div class="success-box" th:if="${delete}">
        <div class="alert alert-danger alert-dismissible fade show">

            <strong>Deleted!</strong>
            <span th:text="${delete}"></span>

            <button class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>
    </div>

    <div class="container-box">

        <!-- Heading -->

        <div class="d-flex flex-column flex-md-row
                    justify-content-between
                    align-items-center
                    gap-3
                    mb-4">

            <h2>Product List</h2>

            <a th:href="@{/product-form}"
               class="btn btn-success">

                + Add Product

            </a>

        </div>

        <!-- Responsive Table -->

        <div class="table-responsive">

            <table class="table table-bordered table-hover table-striped align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.id}"></td>

                    <td th:text="${product.name}"></td>

                    <td>
                        ₹ <span th:text="${product.price}"></span>
                    </td>

                    <td th:text="${product.quantity}"></td>

                    <td th:text="${product.category}"></td>

                    <td th:text="${product.description}"></td>

                    <td>

                        <div class="d-flex flex-column flex-md-row gap-2 justify-content-center">

                            <a class="btn btn-warning btn-sm"

                               th:href="@{/edit(id=${product.id},page=${currentPage})}">

                                Edit

                            </a>

                            <a class="btn btn-danger btn-sm"

                               th:href="@{/delete(id=${product.id},page=${currentPage})}"

                               onclick="return confirm('Are you sure?')">

                                Delete

                            </a>

                        </div>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(products)}">

                    <td colspan="7"
                        class="text-danger fw-bold text-center">

                        No Products Available

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <!-- Pagination -->

        <nav>

            <ul class="pagination justify-content-center flex-wrap">

                <li class="page-item"
                    th:classappend="${currentPage==0} ? ' disabled'">

                    <a class="page-link"

                       th:href="@{/display(page=${currentPage-1})}">

                        &laquo; Previous

                    </a>

                </li>

                <li class="page-item disabled">

                    <span class="page-link">

                        Page [[${currentPage+1}]]
                        of
                        [[${totalPages}]]

                    </span>

                </li>

                <li class="page-item"

                    th:classappend="${currentPage==totalPages-1} ? ' disabled'">

                    <a class="page-link"

                       th:href="@{/display(page=${currentPage+1})}">

                        Next &raquo;

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:if="${success}">

setTimeout(function(){

let alert=document.getElementById("successAlert");

if(alert){

bootstrap.Alert.getOrCreateInstance(alert).close();

}

},5000);

</script>

</body>
</html>
